function statsTiles(t){let arr=[['المباريات',t?.games],['الانتصارات',t?.wins],['التعادلات',t?.draws],['الخسائر',t?.losses],['الأهداف المسجلة',t?.goals],['الأهداف المستقبلة',t?.conceded],['نسبة الفوز',pct(t?.wins,t?.games),'%'],['فارق الأهداف',finite(t?.goals)&&finite(t?.conceded)?t.goals-t.conceded:null]];return `<div class="stat-grid">${arr.map(([label,v,s=''])=>`<article class="tile"><label>${label}</label><b>${show(v)}${finite(v)?s:''}</b><small>موسم ${year}</small></article>`).join('')}</div>`}

ub')")}<div class="player-grid">${db.players.map(playerCard).join('')}</div></section></main>${footer()}`}

// تحليل 2027: تطبيع حسب المباراة ومركز اللاعب، بأوزان شفافة؛ لا يدّعي استخدام نموذج خارجي.
const weights={ST:{goals:35,assists:15,shotPct:12,passPct:8,rating:15,motm:10,discipline:5},CF:{goals:26,assists:23,shotPct:10,passPct:10,rating:16,motm:10,discipline:5},LW:{goals:24,assists:26,shotPct:11,passPct:12,rating:13,motm:9,discipline:5},RW:{goals:24,assists:26,shotPct:11,passPct:12,rating:13,motm:9,discipline:5},CAM:{goals:20,assists:32,passPct:14,rating:18,motm:11,discipline:5},CM:{goals:12,assists:27,passPct:16,tackles:14,rating:17,motm:9,discipline:5},CDM:{goals:5,assists:12,passPct:18,tackles:27,interceptions:13,rating:15,motm:5,discipline:5},CB:{goals:3,assists:4,passPct:12,tackles:24,interceptions:18,clearances:13,csDef:10,rating:11,motm:2,discipline:3},LB:{goals:5,assists:15,passPct:16,tackles:20,interceptions:13,csDef:8,rating:13,motm:5,discipline:5},RB:{goals:5,assists:15,passPct:16,tackles:20,interceptions:13,csDef:8,rating:13,motm:5,discipline:5},GK:{savePct:33,saves:16,csGK:23,rating:20,motm:5,discipline:3}};
const metricLabel={smart:'التقييم التحليلي',games:'المباريات',goals:'الأهداف',assists:'صناعة الأهداف',contributions:'المساهمات الهجومية',gpm:'أهداف/مباراة',apm:'صناعة/مباراة',cpm:'مساهمات/مباراة',motm:'رجل المباراة',passPct:'دقة التمرير',shotPct:'دقة التسديد',tackles:'التدخلات',tacklePct:'نجاح التدخلات',passes:'إجمالي التمريرات',interceptions:'قطع الكرات',clearances:'التشتيت',blocks:'الصد',savePct:'نسبة التصديات',saves:'التصديات',csDef:'شباك نظيفة / دفاع',csGK:'شباك نظيفة / حراسة',win:'نسبة الفوز',rating:'متوسط تقييم اللعبة',red:'البطاقات الحمراء',yellow:'البطاقات الصفراء',points:'النقاط',minutes:'الدقائق',pwr:'مؤشر القوة الأصلي',carry:'مؤشر حمل الفريق',clutch:'مؤشر الحسم'};
const perGameKeys={goals:2.4,assists:1.65,tackles:5,interceptions:5,clearances:8,saves:8,csDef:0.65,csGK:0.65,motm:0.36};
function normalized(p,field){let games=num(p.games);if(field==='discipline')return Math.max(0,100-(num(p.red)*20+num(p.yellow)*5)/Math.max(1,games)*100);if(field==='rating')return Math.max(0,Math.min(100,num(p.rating)*10));if(['passPct','shotPct','savePct'].includes(field))return Math.max(0,Math.min(100,num(p[field])));if(perGameKeys[field])return Math.min(100,100*num(p[field])/Math.max(1,games)/perGameKeys[field]);return 0}
function score2027(p){if(!finite(p.games)||num(p.games)<1)return null;let w=weights[p.pos]||weights.ST,used=[],total=0;for(const [k,n] of Object.entries(w)){let valid=(k==='discipline'?(finite(p.red)||finite(p.yellow)):(finite(p[k])&&finite(p.games)));if(valid){used.push([k,n,normalized(p,k)]);total+=n}}// قيم غير مدخلة لا تُعتبر صفرًا، والنتيجة مؤقتة عند وجود حقول ناقصة
if(used.length<2||used.every(([k])=>k==='discipline'))return null;
const sum=used.reduce((s,[k,w,n])=>s+w*n,0),confidence=100*total/Object.values(w).reduce((a,b)=>a+b,0);return {value:Math.round(sum/total*10)/10,confidence:Math.round(confidence),parts:used}}
function derived(p,k){let g=p.games;if(k==='smart')return year===2027?score2027(p)?.value??null:year===2026?p.pwr:null;if(k==='contributions')return finite(p.goals)&&finite(p.assists)?num(p.goals)+num(p.assists):null;if(k==='gpm')return year===2025?p.sourceGpm:div(p.goals,g);if(k==='apm')return year===2025?p.sourceApm:div(p.assists,g);if(k==='cpm')return div(derived(p,'contributions'),g);if(k==='discipline')return normalized(p,'discipline');return p[k]??null}
const allMetrics=['smart','games','goals','assists','contributions','gpm','apm','cpm','motm','passes','passPct','shotPct','tackles','tacklePct','interceptions','clearances','blocks','saves','savePct','csDef','csGK','win','rating','red','yellow','points','minutes','pwr','carry','clutch'];
function validMetric(k){if(year===2025)return !['smart','passes','interceptions','clearances','blocks','saves','savePct','csDef','csGK','win','rating','red','yellow','minutes','pwr','carry','clutch'].includes(k);if(year===2026)return !['interceptions','clearances','blocks','saves','savePct','yellow','points','minutes'].includes(k);return !['pwr','carry','clutch'].includes(k)}
function ranking(pList,k){return pList.filter(p=>finite(derived(p,k))).slice().sort((a,b)=>{let v=num(derived(b,k))-num(derived(a,k));return ['red','yellow'].includes(k)?-v:v})}
function rankView(){let filtered=getPlayers().filter(p=>currentFilter==='ALL'||p.pos===currentFilter||(['ST','LW','RW','CF'].includes(p.pos)&&currentFilter==='FWD')||(['CM','CAM','CDM'].includes(p.pos)&&currentFilter==='MID')||(['CB','LB','RB'].includes(p.pos)&&currentFilter==='DEF'));
let ranked=ranking(filtered,currentMetric);return `<div class="control-row"><select class="select" id="metricSelect" aria-label="معيار الترتيب" onchange="currentMetric=this.value;render()">${allMetrics.filter(validMetric).map(k=>`<option value="${k}" ${currentMetric===k?'selected':''}>${metricLabel[k]}</option>`).join('')}</select><select class="select" aria-label="تصفية المركز" onchange="currentFilter=this.value;render()"><option value="ALL" ${currentFilter==='ALL'?'selected':''}>كل المراكز</option>${['FWD','MID','DEF',...Object.keys(POS)].map(k=>`<option ${currentFilter===k?'selected':''} value="${k}">${{FWD:'الهجوم',MID:'الوسط',DEF:'الدفاع'}[k]||POS[k]}</option>`).join('')}</select></div>${year===2027?`<div class="notice">${currentMetric==='smart'?'التقييم التحليلي يتغير تلقائيًا بحسب مركز اللاعب وبحسب البيانات المدخلة. لا يظهر تقييم دون مباريات وحقول كافية؛ وتظهر نسبة اكتمال التقييم بجوار القيمة.':'الترتيب الحالي محسوب من البيانات التي أدخلتها، وليس نتيجة جائزة رسمية.'} <button style="border:0;background:none;color:#176a58;font-weight:900" onclick="openFormula()">كيف يُحسب؟</button></div>`:''}<div class="table-scroll"><table><thead><tr><th>#</th><th>اللاعب</th><th>المركز</th><th>${esc(metricLabel[currentMetric])}</th>${currentMetric==='smart'&&year===2027?'<th>اكتمال التقييم</th>':''}</tr></thead><tbody>${ranked.map((p,i)=>`<tr class="clickrow" onclick="openPlayer('${p.id}')"><td><span class="rank-pill ${i<3?'gold':''}">${i+1}</span></td><td><b dir="ltr">${esc(p.name)}</b><br><small>${FLAGS[p.nationality]||''} ${esc(p.nationality)}</small></td><td>${esc(POS[p.pos]||p.pos)}</td><td><strong style="font:900 19px Outfit;color:#156e5c">${show(derived(p,currentMetric))}</strong></td>${currentMetric==='smart'&&year===2027?`<td>${score2027(p)?.confidence??0}%</td>`:''}</tr>`).join('')}</tbody></table>${!ranked.length?'<div class="empty">لا توجد بيانات كافية لهذا الترتيب بعد.</div>':''}</div>`}
function playerTable(){const cols=['games','goals','assists','contributions','gpm','apm','motm','passPct','shotPct'];return `<div class="table-scroll"><table><thead><tr><th>اللاعب</th><th>المركز</th>${cols.map(k=>`<th>${metricLabel[k]}</th>`).join('')}</tr></thead><tbody>${getPlayers().map(p=>`<tr class="clickrow" onclick="openPlayer('${p.id}')"><td><b dir="ltr">${esc(p.name)}</b></td><td>${esc(POS[p.pos]||p.pos)}</td>${cols.map(k=>`<td>${show(derived(p,k))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function historicAwards(){let order=year===2025?ARCHIVE.rank25:ARCHIVE.rank26,list=getPlayers();return `<div class="panel"><h3>🏆 الترتيب الرسمي للكرة الذهبية ${year}</h3><p class="formula">الترتيب الرسمي الذي زوّدنا به النادي؛ مستقل عن التقييمات التحليلية.</p>${order.map((id,i)=>{let p=list.find(x=>x.id===id);return `<div class="ranking-entry" onclick="openPlayer('${id}')"><span class="rank-num">${i+1}</span><div class="details"><b>${esc(p?.name||id)}</b><small>${esc(POS[p?.pos]||p?.pos||'')}</small></div>${i<3?'<strong>✦</strong>':''}</div>`}).join('')}</div>`}
function stats(){let t=getTeam(),players=getPlayers();return `${banner(`إحصائيات موسم ${year}`,year===2027?'مركز الإحصائيات والتحليلات الحية المبنية على إدخالاتك':`أرشيف ${year} الثابت · البيانات الأصلية للموسم`)}<main class="wrap main-sections">${navStats()}<div class="archive-title">${heading('SEASON INTELLIGENCE',year===2027?'لوحة أداء 2027':`السجل العام لموسم ${year}`)}${year===2027?'<button class="btn btn-green" onclick="go(\'admin\')">⚙ تحديث إحصائيات 2027</button>':'<span class="badge fixed">🔒 أرشيف ثابت</span>'}</div>${t?statsTiles(t):'<div class="notice">لم تُرسل حصيلة النادي الإجمالية لعام 2025؛ تتوفر إحصائيات اللاعبين وترتيب الكرة الذهبية فقط.</div>'}${t?extraTiles(t):''}<div class="section" style="margin-top:38px">${heading('FIRST TEAM / PLAYER DATA','جميع إحصائيات اللاعبين')}<div class="panel">${playerTable()}<p class="formula">اضغط على أي لاعب لفتح جميع تفاصيله وحقول الموسم المتاحة، وليس الإحصائيات المختصرة فقط.</p></div></div><section class="section">${heading('INTELLIGENCE / RANKING',year===2027?'المحلل الذكي وترتيب اللاعبين':'الترتيبات الإحصائية')}<div class="stat-layout"><div class="panel"><h3>اختر المعيار والمركز</h3>${rankView()}</div>${year===2027?`<div class="panel"><h3>كيف يعمل المحلل؟</h3><p class="formula">محرك تقييم محلي داخل الملف، وليس خدمة ذكاء اصطناعي سحابية. يقرأ الأهداف والصناعة والمباريات والدقة والمساهمات الدفاعية والتقييم ورجل المباراة والانضباط؛ وتختلف الأوزان حسب المركز.</p><p class="formula">يتجنب افتراض أن الخانات الفارغة تساوي صفرًا؛ لذلك يعرض مدى اكتمال البيانات.</p><button class="btn btn-green" onclick="openFormula()">الأوزان والمعادلات</button><hr><h3>مساهمات هجومية</h3>${ranking(db.players,'contributions').slice(0,5).map((p,i)=>`<div class="ranking-entry" onclick="openPlayer('${p.id}')"><span class="rank-num">${i+1}</span><span class="details"><b>${esc(p.name)}</b></span><strong>${show(derived(p,'contributions'))}</strong></div>`).join('')||'<p class="formula">أدخل الأهداف والصناعة أولًا.</p>'}</div>`:historicAwards()}</div></section><section class="section">${heading('FIRST TEAM','ملفات اللاعبين')}<div class="player-grid">${players.map(playerCard).join('')}</div></section>${year===2026?matchHistory():''}${year===2027?matchHistory():''}${year===2025?'<div class="notice">ملاحظة أرشيفية: بطاقة ALMOUSA3M الأصلية تعرض 690 مباراة، بينما رجل المباراة 221 / 700. لم يتم تعديل أيٍّ من الرقمين.</div>':''}</main>${footer()}`}
function matchHistory(){let m=year===2026?ARCHIVE.matches26:year===2027?db.matches:[];if(!m.length)return `<section class="section"><div class="panel"><h3>سجل المباريات</h3><div class="empty">لم تُدخل مباريات 2027 بعد.</div></div></section>`;return `<section class="section">${heading('MATCH CENTER','سجل المباريات')}<div class="panel"><div class="table-scroll"><table><thead><tr><th>النتيجة</th><th>الخصم</th><th>الموعد</th><th>الهدافون</th><th>رجل المباراة</th></tr></thead><tbody>${m.map(item=>{let [res,score,opp,scorers,motm,date]=Array.isArray(item)?item:[item.result,item.score,item.opponent,item.scorers,item.motm,item.date];return `<tr><td><span class="match-pill ${esc(res)}">${res==='W'?'فوز':res==='L'?'خسارة':res==='D'?'تعادل':'—'}</span> <b dir="ltr">${esc(score||'—')}</b></td><td dir="ltr">${esc(opp||'—')}</td><td dir="ltr">${esc(date||'—')}</td><td>${esc(scorers||'—')}</td><td>${esc(motm||'—')}</td></tr>`}).join('')}</tbody></table></div></div></section>`}
function openPlayer(id){let p=getPlayers().find(x=>x.id===id);if(!p)return;let stats=year===2025?[['المباريات',p.games],['الأهداف',p.goals],['الأهداف/مباراة حسب المصدر',p.sourceGpm],['التمريرات الحاسمة',p.assists],['الصناعة/مباراة حسب المصدر',p.sourceApm],['إجمالي المساهمات (محسوبة)',derived(p,'contributions')],['رجل المباراة',`${p.motm} / ${p.motmBase}`],['دقة التمرير',p.passPct,'%'],['دقة التسديد',p.shotPct,'%'],['نسبة التدخلات',p.tacklePct,'%'],['نقاط البطاقة',p.points]]:year===2026?[['المباريات',p.games],['نسبة الفوز',p.win,'%'],['متوسط تقييم اللعبة',p.rating],['التقييم العام OVR',p.ovr],['الطول',p.h],['اسم المحترف',p.pro],['الأهداف',p.goals],['الأهداف/مباراة',p.gpm],['التمريرات الحاسمة',p.assists],['الصناعة/مباراة',div(p.assists,p.games)],['المساهمات الهجومية',derived(p,'contributions')],['المساهمات/مباراة',derived(p,'cpm')],['رجل المباراة',p.motm],['نسبة التسديد',p.shot,'%'],['إجمالي التمريرات',p.passes],['التمريرات/مباراة',div(p.passes,p.games)],['دقة التمرير',p.pass,'%'],['التدخلات',p.tackles],['التدخلات/مباراة',div(p.tackles,p.games)],['نجاح التدخلات',p.tackleRate,'%'],['شباك نظيفة دفاع',p.csDef],['شباك نظيفة حراسة',p.csGK],['بطاقات حمراء',p.red],['مؤشر القوة الأصلي',p.pwr,'/100'],['مؤشر حمل الفريق',p.carry,'/100'],['مؤشر الحسم',p.clutch]]:[['المباريات',p.games],...numericFields.filter(k=>k!=='games').map(k=>[metricLabel[k]||k,p[k],['passPct','shotPct','tacklePct','savePct','win'].includes(k)?'%':'']),['المساهمات الهجومية',derived(p,'contributions')],['الأهداف/مباراة',derived(p,'gpm')],['الصناعة/مباراة',derived(p,'apm')],['التقييم التحليلي',score2027(p)?.value??null,'/100'],['اكتمال التقييم',score2027(p)?.confidence??null,'%']];let extras=year===2026?`<div class="notice"><b>تقرير الكشاف:</b> ${esc(p.note)}<br><b>سجل الأهداف السابق:</b> ${esc(p.recent.join('، '))}</div>`:year===2025&&p.id==='alm'?'<div class="notice">تعارض موثق في البطاقة: 690 مباراة، بينما مقام رجل المباراة 700؛ وتُعرض المعدلات المطبوعة كما هي.</div>':'';
$('#modalTitle').textContent=`${p.name} · ${year}`;$('#modalBody').innerHTML=`<div class="modal-profile"><div class="modal-image">${asset(p.photo,'',p.name)}<div class="avatar-placeholder" style="display:none">TFC</div></div><div><span class="badge">${esc(POS[p.pos]||p.pos)}</span><h2 dir="ltr">${esc(p.name)}</h2><p> ${FLAGS[p.nationality]||''} ${esc(p.nationality)} · موسم ${year}</p><p class="formula">${year===2027?'البيانات تظهر تلقائيًا فور إدخالها من لوحة الإدارة.':'بيانات هذا الموسم محفوظة كأرشيف ثابت.'}</p>${year===2027?`<button class="btn btn-green" onclick="closeModal();editPlayer('${p.id}')">تحديث بيانات اللاعب</button>`:''}</div></div><div class="kv" style="margin-top:21px">${stats.map(([k,v,s=''])=>`<div><small>${esc(k)}</small><b>${show(v)}${finite(v)?esc(s):''}</b></div>`).join('')}</div>${extras}`;$('#modal').classList.add('show');document.body.style.overflow='hidden'}

function openFormula(){let p=year===2027?db.players:null;$('#modalTitle').textContent='منهجية التقييم التحليلي 2027';$('#modalBody').innerHTML=`<div class="notice">هذا محرك تحليل إحصائي تفسيري يعمل دون إنترنت. ليس نموذج ذكاء اصطناعي مدربًا ولا يستدعي واجهة API. يتغير التقييم فور تغيير الإحصائيات.</div><h3>معادلة التقييم</h3><p>متوسط موزون للمؤشرات المتوفرة حسب المركز. يُحوّل معدل الأهداف والصناعة والتدخلات والإنقاذ إلى درجات من 100، ويأخذ دقة التمرير والتسديد والتقييم العام والانضباط بعين الاعتبار.</p><p class="formula">الحقول الفارغة مستبعدة من البسط والمقام، لذلك تُعرض نسبة اكتمال التقييم، ويشترط توفر المباريات ومؤشرين معتبرين. الأصفار المدخلة محسوبة كأصفار فعلية. لضمان مقارنة منصفة، أدخل جميع المؤشرات المطلوبة لكل مركز.</p><div class="table-scroll"><table><thead><tr><th>المركز</th><th>الأوزان (%)</th></tr></thead><tbody>${Object.entries(weights).map(([pos,w])=>`<tr><td>${esc(POS[pos])} (${pos})</td><td>${Object.entries(w).map(([k,v])=>`${esc(metricLabel[k]||({discipline:'الانضباط'}[k]||k))}: ${v}%`).join(' · ')}</td></tr>`).join('')}</tbody></table></div><p class="formula">حدود التطبيع المستخدمة: الأهداف 2.4/مباراة؛ الصناعة 1.65؛ التدخلات وقطع الكرات 5؛ التشتيت والتصديات 8؛ الشباك النظيفة 0.65؛ رجل المباراة 0.36؛ تقييم اللعبة ÷ 10. هذه معايير تصميم داخلية قابلة للتطوير وليست مقاييس رسمية من اللعبة. لا تُستخدم للتنبؤ بنتائج المباريات.</p>`;$('#modal').classList.add('show');document.body.style.overflow='hidden'}
function guide(){return `${banner('تحديث بيانات النادي','كل التعديلات من الكود في data.js')}<main class="wrap main-sections"><section class="section"><div class="panel" style="line-height:2.2"><h2>كيف تضيف بيانات؟</h2><p>افتح <code>data.js</code> بمحرر مثل VS Code. عدّل كائن <code>window.TAWHID_DATA</code> ثم احفظ الملف وأعد تحديث الصفحة. التعديل محفوظ في الملف فعليًا، وعند نشره على الاستضافة سيظهر لجميع الزوار.</p><h3>أقسام ملف البيانات</h3><p><b>team:</b> إحصائيات النادي في 2027. اترك قيم مباريات الفريق الأساسية <code>null</code> ليتم حسابها من سجل المباريات إن كان موجودًا.</p><p><b>players:</b> بيانات وإحصائيات اللاعبين، ويمكن تعديل المركز أو الصورة والمباريات والأهداف والتمريرات وبقية الحقول. الترتيب والتقييم يُعاد حسابهما تلقائيًا حسب المركز.</p><p><b>news:</b> أضف عناصر الأخبار (العنوان والتاريخ واسم صورة A1.PNG والنص).</p><p><b>gallery:</b> أضف أحدث الصور باستخدام B1.PNG ثم B2.PNG وهكذا.</p><p><b>matches:</b> سجل المباريات والخصوم والنتائج والهدافين ورجل المباراة.</p><p><b>description:</b> وصف الصفحة الرئيسية.</p><div class="notice">أرشيف موسمي 2025 و2026 محفوظ ثابتًا داخل index.html ولا يتأثر بأي تعديل في data.js. ضع الصور والشعار والرعاة بجانب الملفين. إذا فتحت الموقع محليًا فقد يلزم تحديث الصفحة تحديثًا كاملًا بعد تعديل data.js.</div></div></section></main>${footer()}`}
